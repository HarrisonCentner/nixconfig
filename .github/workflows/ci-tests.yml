name: ci-tests

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: '17 7 * * *'

jobs:
  vm-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [electron-vimium]
    steps:
      - uses: actions/checkout@v4

      # NixOS tests need /dev/kvm; it is root:kvm 0660 on hosted runners, so the
      # nixbld users can't open it. Must precede the nix install.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v30

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-ci-tests-${{ matrix.test }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-ci-tests-${{ matrix.test }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-ci-tests-${{ matrix.test }}-
          purge-created: 0
          purge-primary-key: never
          purge-last-accessed: 604800

      - run: nix build --print-build-logs .#legacyPackages.x86_64-linux.ciTests.${{ matrix.test }}
